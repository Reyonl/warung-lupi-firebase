name: Flutter CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Validate & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        # build.gradle.kts: sourceCompatibility/targetCompatibility = Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.5
        # Versi sama persis dengan yang dipakai di lokal (flutter --version).
        # JANGAN upgrade versi ini tanpa upgrade Flutter lokal.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Info & non-fatal warning lint tidak menggagalkan CI.
        # Hard gate dipegang oleh 'flutter test' (102 tests).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk